<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="북톡 로고">
  <!-- 북톡 엠블럼: 둥근 글자(BOOKTALK / read · talk · share) + 가운데 말풍선과 펼친 책 -->
  <defs>
    <path id="arcTop" d="M 15,50 A 35,35 0 0 1 85,50"/>
    <path id="arcBottom" d="M 9,50 A 41,41 0 0 0 91,50"/>
  </defs>

  <!-- 위쪽 둥근 글자 -->
  <text font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="1.6" fill="#c2553a">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">BOOKTALK</textPath>
  </text>

  <!-- 아래쪽 둥근 글자 -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="8.5" font-style="italic" letter-spacing="0.6" fill="#c2553a">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">read · talk · share</textPath>
  </text>

  <!-- 좌우 구분 점 -->
  <circle cx="11" cy="57" r="2" fill="#c2553a"/>
  <circle cx="89" cy="57" r="2" fill="#c2553a"/>

  <!-- 가운데 원 -->
  <circle cx="50" cy="51" r="21" fill="#c2553a"/>

  <!-- 말풍선 (톡) -->
  <path d="M 42,33.5 h 16 a 4,4 0 0 1 4,4 v 4.5 a 4,4 0 0 1 -4,4 h -6 l -3.5,3.5 v -3.5 h -6.5 a 4,4 0 0 1 -4,-4 v -4.5 a 4,4 0 0 1 4,-4 z" fill="#fff"/>
  <circle cx="45" cy="39.8" r="1.3" fill="#c2553a"/>
  <circle cx="50" cy="39.8" r="1.3" fill="#c2553a"/>
  <circle cx="55" cy="39.8" r="1.3" fill="#c2553a"/>

  <!-- 펼친 책 (북) -->
  <path d="M 50,54.5 C 46,52 40.5,51.5 36,52.5 V 64 C 40.5,63 46,63.5 50,66 Z" fill="#fff"/>
  <path d="M 50,54.5 C 54,52 59.5,51.5 64,52.5 V 64 C 59.5,63 54,63.5 50,66 Z" fill="#fff" opacity="0.85"/>
</svg>
